<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- iOS 26 Liquid Glass Background Gradient -->
    <linearGradient id="liquidGlassBg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="35%" stop-color="#8B5CF6" />
      <stop offset="70%" stop-color="#6B21A8" />
      <stop offset="100%" stop-color="#371840" />
    </linearGradient>

    <!-- Glass Specular Reflection Highlight -->
    <linearGradient id="specularRim" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Warm Amber Ambient Glow -->
    <radialGradient id="amberGlow" cx="440" cy="440" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow for Document Sheets -->
    <filter id="sheetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1A1A2E" flood-opacity="0.32" />
    </filter>

    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1A1A2E" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- iOS Continuous Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#liquidGlassBg)" />
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#amberGlow)" />
  <rect x="22" y="22" width="468" height="468" rx="106" stroke="url(#specularRim)" stroke-width="4" />

  <!-- Stacked Notebook Sheets Motif -->
  <!-- Back Document Sheet -->
  <rect x="220" y="96" width="168" height="224" rx="20" fill="#E0E7FF" fill-opacity="0.65" />
  
  <!-- Front Document Sheet -->
  <rect x="180" y="118" width="186" height="248" rx="22" fill="#FFFFFF" fill-opacity="0.96" filter="url(#sheetShadow)" />
  
  <!-- Subtle Document Ruling Lines -->
  <rect x="236" y="160" width="102" height="7" rx="3.5" fill="#CBD5E1" />
  <rect x="236" y="184" width="102" height="7" rx="3.5" fill="#CBD5E1" />
  <rect x="236" y="208" width="76" height="7" rx="3.5" fill="#CBD5E1" />

  <!-- Iconic Kadjelo "K" Glyph -->
  <!-- 1. K Stem (Imperial Purple #371840) -->
  <g filter="url(#glyphShadow)">
    <!-- Vertical Pill Spine -->
    <rect x="108" y="112" width="44" height="220" rx="22" fill="#371840" />
    <!-- Diagonal Upward Arm -->
    <path d="M128 250 L274 146" stroke="#371840" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 2. K Chevron (Vibrant Amber #F59E0B) -->
  <g filter="url(#glyphShadow)">
    <path d="M280 274 L176 348 L272 414" stroke="#F59E0B" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
